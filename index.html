<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>黄页</title>
<style>
  :root {
    --yellow: #ffd21f;
    --ink: #1a1a1a;
    --bg: #ffffff;
    --fg: #1a1a1a;
    --muted: #5c5c5c;
    --line: #d4d4d4;
    --chip: #f0f0f0;
    --card: #fafafa;
    --head-bg: #1a1a1a;
    --head-fg: #ffd21f;
    --font: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", "Source Han Sans SC", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141414;
      --fg: #ececec;
      --muted: #a6a6a6;
      --line: #343434;
      --chip: #242424;
      --card: #1b1b1b;
      --head-bg: #ffd21f;
      --head-fg: #1a1a1a;
    }
  }

  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: var(--font);
    font-size: 15px;
    line-height: 1.55;
    -webkit-text-size-adjust: 100%;
  }
  a { color: inherit; }
  button { font: inherit; color: inherit; }
  :focus-visible { outline: 3px solid var(--fg); outline-offset: 2px; }
  .cover :focus-visible { outline-color: var(--ink); }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  .wrap { max-width: 1440px; margin: 0 auto; padding: 0 16px; }
  @media (min-width: 720px) { .wrap { padding: 0 28px; } }

  /* ---------- 顶栏：标题和搜索同一行 ---------- */
  .cover { background: var(--yellow); color: var(--ink); padding: 14px 0; }
  .cover .wrap { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 24px; }
  h1 {
    margin: 0;
    font-size: 2.5rem;
    line-height: 1;
    font-weight: 900;
    letter-spacing: -0.03em;
  }
  .search { flex: 1 1 280px; display: block; }
  .search input {
    width: 100%;
    font: inherit;
    font-size: 1rem;
    padding: 9px 12px;
    background: #fff;
    color: #1a1a1a;
    border: 2px solid var(--ink);
    border-radius: 0;
    appearance: none;
  }
  .search input::placeholder { color: #6b6b6b; }
  .count { margin: 0; font-size: 0.875rem; font-weight: 600; white-space: nowrap; }

  /* ---------- 分类导航 ---------- */
  .index {
    position: sticky;
    top: 0;
    z-index: 5;
    background: var(--bg);
    border-bottom: 1px solid var(--line);
  }
  .index ul {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    gap: 4px 18px;
    overflow-x: auto;
    white-space: nowrap;
  }
  .index a {
    display: inline-block;
    padding: 8px 0;
    text-decoration: none;
    font-weight: 700;
    border-bottom: 3px solid transparent;
  }
  .index a:hover { border-bottom-color: var(--yellow); }
  .index .n { color: var(--muted); font-weight: 400; margin-left: 4px; }

  /* ---------- 筛选 ---------- */
  .filters { padding: 10px 0 0; display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: center; }
  .chip {
    cursor: pointer;
    padding: 1px 10px;
    background: var(--chip);
    border: 1px solid transparent;
    border-radius: 999px;
    font-size: 0.8125rem;
    line-height: 1.6;
  }
  .chip:hover { border-color: var(--fg); }
  .chip[aria-pressed="true"] { background: var(--yellow); color: var(--ink); border-color: var(--ink); font-weight: 700; }
  .link-btn {
    cursor: pointer;
    background: none;
    border: 0;
    padding: 1px 4px;
    color: var(--muted);
    font-size: 0.8125rem;
    text-decoration: underline;
    text-underline-offset: 3px;
  }
  .link-btn:hover { color: var(--fg); }
  .toggle { display: inline-flex; align-items: center; gap: 5px; font-size: 0.8125rem; cursor: pointer; margin-left: 4px; }
  .toggle input { width: 15px; height: 15px; accent-color: var(--ink); }

  /* ---------- 目录 ---------- */
  main { padding-bottom: 40px; }
  .cat { margin-top: 18px; scroll-margin-top: 46px; }
  .cat-head {
    margin: 0 0 10px;
    padding: 3px 12px;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    background: var(--head-bg);
    color: var(--head-fg);
    font-size: 1.0625rem;
    font-weight: 800;
    line-height: 1.5;
  }
  .cat-head .n { font-size: 0.8125rem; font-weight: 600; }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
    gap: 8px;
    align-items: start;
  }

  /* ---------- 卡片 ---------- */
  .card {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto auto;
    align-items: center;
    background: var(--card);
    border: 1px solid var(--line);
  }
  .card:hover, .card:focus-within { border-color: var(--fg); }
  .card.open { border-color: var(--fg); }

  .main {
    display: flex;
    gap: 10px;
    align-items: center;
    min-width: 0;
    padding: 9px 4px 9px 10px;
    text-decoration: none;
  }
  .ico {
    flex: none;
    width: 34px;
    height: 34px;
    display: grid;
    place-items: center;
    background: var(--chip);
    overflow: hidden;
  }
  .ico img { width: 26px; height: 26px; display: block; }
  .ico-l { font-size: 0.95rem; font-weight: 800; color: var(--muted); }
  .txt { min-width: 0; line-height: 1.3; }
  .name {
    display: block;
    font-weight: 800;
    font-size: 1rem;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .main:hover .name { background: var(--yellow); color: var(--ink); }
  .desc {
    display: block;
    margin-top: 2px;
    font-size: 0.8125rem;
    color: var(--muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .price {
    font-size: 0.6875rem;
    line-height: 1.4;
    padding: 0 5px;
    border: 1px solid currentColor;
    color: var(--muted);
    white-space: nowrap;
  }
  .price.paid { background: var(--yellow); color: var(--ink); border-color: var(--ink); font-weight: 700; }
  .more {
    cursor: pointer;
    width: 32px;
    height: 32px;
    margin: 0 2px 0 4px;
    background: none;
    border: 0;
    color: var(--muted);
    font-size: 0.8125rem;
  }
  .more:hover { color: var(--fg); background: var(--chip); }
  .more::before { content: "▾"; display: inline-block; transition: transform 0.12s; }
  .card.open .more::before { transform: rotate(180deg); }
  @media (prefers-reduced-motion: reduce) { .more::before { transition: none; } }

  .detail {
    grid-column: 1 / -1;
    padding: 8px 12px 10px;
    border-top: 1px dotted var(--line);
    font-size: 0.875rem;
  }
  .detail .host { color: var(--muted); font-size: 0.8125rem; overflow-wrap: anywhere; }
  .detail .full { margin: 4px 0 0; }
  .detail .note {
    margin: 6px 0 0;
    padding-left: 10px;
    border-left: 4px solid var(--yellow);
    color: var(--muted);
  }
  .detail .note b { color: var(--fg); margin-right: 6px; }
  .tags { list-style: none; margin: 8px 0 0; padding: 0; display: flex; flex-wrap: wrap; gap: 2px 12px; }
  .tag {
    cursor: pointer;
    background: none;
    border: 0;
    padding: 0;
    font-size: 0.8125rem;
    color: var(--muted);
    text-decoration: underline;
    text-decoration-color: var(--line);
    text-underline-offset: 3px;
  }
  .tag:hover { color: var(--fg); text-decoration-color: var(--yellow); text-decoration-thickness: 2px; }
  .tag[aria-pressed="true"] { color: var(--fg); font-weight: 700; text-decoration-color: var(--yellow); text-decoration-thickness: 2px; }

  .empty { margin: 36px 0; padding: 20px; border: 2px dashed var(--line); }
  .empty p { margin: 0 0 6px; }

  footer { border-top: 1px solid var(--line); padding: 12px 0 28px; color: var(--muted); font-size: 0.8125rem; }
  footer p { margin: 0; }
  kbd {
    font: inherit;
    font-size: 0.75rem;
    padding: 0 5px;
    border: 1px solid var(--line);
    background: var(--chip);
  }
</style>
</head>
<body>

<header class="cover">
  <div class="wrap">
    <h1 id="title">黄页</h1>
    <label class="search">
      <span class="sr">搜索站点</span>
      <input id="q" type="search" placeholder="搜名称、用途、解读或标签，按 / 直接输入" autocomplete="off" spellcheck="false">
    </label>
    <p class="count" id="count" aria-live="polite"></p>
  </div>
</header>

<nav class="index" aria-label="分类">
  <div class="wrap"><ul id="index"></ul></div>
</nav>

<div class="wrap">
  <section class="filters" aria-label="筛选">
    <div id="tag-row" style="display:contents"></div>
    <label class="toggle"><input type="checkbox" id="free"> 只看免费</label>
    <button class="link-btn" id="more-tags" type="button"></button>
    <button class="link-btn" id="clear" type="button" hidden>清除筛选</button>
  </section>

  <main id="directory"></main>

  <footer>
    <p>点卡片打开网站，点右侧 ▾ 展开解读，鼠标悬停也能看到简介和解读。加站点：打开 <kbd>sites.js</kbd>，照着已有格式加一条。<kbd>/</kbd> 搜索，<kbd>Enter</kbd> 打开第一个结果，<kbd>Esc</kbd> 清空。</p>
  </footer>
</div>

<script src="sites.js"></script>
<script>
(function () {
  "use strict";

  var data = window.START_PAGE;
  var main = document.getElementById("directory");

  if (!data || !Array.isArray(data.sites)) {
    var err = document.createElement("div");
    err.className = "empty";
    err.innerHTML = "<p><b>没有读到站点数据。</b></p><p>请确认 sites.js 和 index.html 在同一个文件夹，并且 sites.js 里的内容没有语法错误。</p>";
    main.appendChild(err);
    return;
  }

  var $ = function (id) { return document.getElementById(id); };
  var qInput = $("q"), countEl = $("count"), indexEl = $("index"), tagRow = $("tag-row");
  var freeBox = $("free"), moreBtn = $("more-tags"), clearBtn = $("clear");

  document.title = data.title || "黄页";
  $("title").textContent = data.title || "黄页";
  var newTab = data.openInNewTab !== false;
  var useFallbackIcon = data.iconFallback !== false;

  /* ---------- 数据整理 ---------- */
  var cats = (data.categories || []).slice();
  var known = {};
  cats.forEach(function (c) { known[c.id] = true; });

  function parseUrl(u) {
    try {
      var x = new URL(u);
      return (x.protocol === "http:" || x.protocol === "https:") ? x : null;
    } catch (e) { return null; }
  }

  var sites = data.sites.filter(function (s) { return s && s.name && s.url; }).map(function (s) {
    var u = parseUrl(s.url);
    var tags = Array.isArray(s.tags) ? s.tags : [];
    return {
      name: String(s.name),
      url: u ? u.href : "",
      origin: u ? u.origin : "",
      host: u ? u.hostname.replace(/^www\./, "") : String(s.url),
      catId: known[s.cat] ? s.cat : "_other",
      desc: s.desc || "",
      note: s.note || "",
      tags: tags.map(String),
      price: s.price || "",
      icon: s.icon || "",
      hay: [s.name, s.url, s.desc, s.note, tags.join(" "), s.price].join(" ").toLowerCase()
    };
  });
  if (sites.some(function (s) { return s.catId === "_other"; })) cats.push({ id: "_other", name: "未分类" });

  var tagCount = {};
  sites.forEach(function (s) { s.tags.forEach(function (t) { tagCount[t] = (tagCount[t] || 0) + 1; }); });
  var allTags = Object.keys(tagCount).sort(function (a, b) {
    return tagCount[b] - tagCount[a] || a.localeCompare(b, "zh");
  });

  var state = { q: "", tags: [], free: false, showAllTags: false };
  var openSet = {};

  /* ---------- 小工具 ---------- */
  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }

  function matches(s) {
    if (state.free && s.price !== "免费") return false;
    for (var i = 0; i < state.tags.length; i++) {
      if (s.tags.indexOf(state.tags[i]) < 0) return false;
    }
    var terms = state.q.toLowerCase().split(/\s+/).filter(Boolean);
    for (var j = 0; j < terms.length; j++) {
      if (s.hay.indexOf(terms[j]) < 0) return false;
    }
    return true;
  }

  function toggleTag(t) {
    var i = state.tags.indexOf(t);
    if (i >= 0) state.tags.splice(i, 1); else state.tags.push(t);
    render(t);
  }

  /* 图标：自己指定的 -> 网站自带 favicon -> 备用服务 -> 首字 */
  var okIcons = {};
  function iconSources(s) {
    var list = [];
    if (s.icon) list.push(s.icon);
    else {
      if (s.origin) list.push(s.origin + "/favicon.ico");
      if (useFallbackIcon && s.host) list.push("https://icons.duckduckgo.com/ip3/" + s.host + ".ico");
    }
    return list;
  }

  function iconNode(s) {
    var wrap = el("span", "ico");
    wrap.setAttribute("aria-hidden", "true");
    var letter = el("span", "ico-l", Array.from(s.name)[0] || "?");
    wrap.appendChild(letter);
    var sources = iconSources(s);

    function tryAt(i) {
      if (i >= sources.length) return;
      var src = sources[i];
      if (okIcons[src] === false) { tryAt(i + 1); return; }
      var img = new Image();
      img.alt = "";
      img.width = 26;
      img.height = 26;
      img.referrerPolicy = "no-referrer";
      img.onload = function () {
        if (img.naturalWidth < 2) { okIcons[src] = false; tryAt(i + 1); return; }
        okIcons[src] = true;
        if (letter.parentNode === wrap) wrap.replaceChild(img, letter);
      };
      img.onerror = function () { okIcons[src] = false; tryAt(i + 1); };
      img.src = src;
    }
    tryAt(0);
    return wrap;
  }

  function cardNode(s) {
    var key = s.url || s.name;
    var card = el("article", "card");
    var isOpen = !!openSet[key];
    if (isOpen) card.classList.add("open");

    var a = el("a", "main");
    if (s.url) {
      a.href = s.url;
      if (newTab) { a.target = "_blank"; a.rel = "noopener"; }
    }
    a.title = [s.name, s.desc, s.note].filter(Boolean).join("\n");
    a.appendChild(iconNode(s));
    var txt = el("span", "txt");
    txt.appendChild(el("span", "name", s.name));
    if (s.desc) txt.appendChild(el("span", "desc", s.desc));
    a.appendChild(txt);
    card.appendChild(a);

    card.appendChild(s.price ? el("span", s.price === "免费" ? "price" : "price paid", s.price) : el("span"));

    var hasDetail = !!(s.note || s.tags.length || s.desc);
    var more = el("button", "more");
    more.type = "button";
    more.setAttribute("aria-expanded", isOpen ? "true" : "false");
    more.setAttribute("aria-label", "展开 " + s.name + " 的解读");
    if (!hasDetail) more.hidden = true;
    card.appendChild(more);

    var detail = el("div", "detail");
    detail.hidden = !isOpen;
    detail.appendChild(el("div", "host", s.host));
    if (s.desc) detail.appendChild(el("p", "full", s.desc));
    if (s.note) {
      var note = el("p", "note");
      note.appendChild(el("b", null, "解读"));
      note.appendChild(document.createTextNode(s.note));
      detail.appendChild(note);
    }
    if (s.tags.length) {
      var ul = el("ul", "tags");
      s.tags.forEach(function (t) {
        var li = el("li");
        var b = el("button", "tag", t);
        b.type = "button";
        b.setAttribute("aria-pressed", state.tags.indexOf(t) >= 0 ? "true" : "false");
        b.addEventListener("click", function () { toggleTag(t); });
        li.appendChild(b);
        ul.appendChild(li);
      });
      detail.appendChild(ul);
    }
    card.appendChild(detail);

    more.addEventListener("click", function () {
      var nowOpen = detail.hidden;
      detail.hidden = !nowOpen;
      card.classList.toggle("open", nowOpen);
      more.setAttribute("aria-expanded", nowOpen ? "true" : "false");
      if (nowOpen) openSet[key] = true; else delete openSet[key];
    });
    return card;
  }

  /* ---------- 渲染 ---------- */
  var firstVisible = null;

  function render(focusTag) {
    var visible = sites.filter(matches);
    firstVisible = visible.length ? visible[0] : null;
    var filtering = state.q.trim() !== "" || state.tags.length > 0 || state.free;

    countEl.textContent = filtering
      ? "找到 " + visible.length + " / " + sites.length
      : "共 " + sites.length + " 个站点";
    clearBtn.hidden = !filtering;

    tagRow.textContent = "";
    var shown = allTags.filter(function (t) {
      return state.showAllTags || tagCount[t] >= 2 || state.tags.indexOf(t) >= 0;
    });
    shown.forEach(function (t) {
      var b = el("button", "chip", t + " " + tagCount[t]);
      b.type = "button";
      b.dataset.tag = t;
      b.setAttribute("aria-pressed", state.tags.indexOf(t) >= 0 ? "true" : "false");
      b.addEventListener("click", function () { toggleTag(t); });
      tagRow.appendChild(b);
    });
    moreBtn.hidden = allTags.length === shown.length && !state.showAllTags;
    moreBtn.textContent = state.showAllTags ? "收起标签" : "全部标签";

    indexEl.textContent = "";
    main.textContent = "";

    cats.forEach(function (c) {
      var list = visible.filter(function (s) { return s.catId === c.id; });
      if (!list.length) return;

      var li = el("li");
      var link = el("a", null, c.name);
      link.href = "#cat-" + c.id;
      link.appendChild(el("span", "n", String(list.length)));
      li.appendChild(link);
      indexEl.appendChild(li);

      var sec = el("section", "cat");
      sec.id = "cat-" + c.id;
      var h = el("h2", "cat-head");
      h.appendChild(el("span", null, c.name));
      h.appendChild(el("span", "n", list.length + " 个"));
      sec.appendChild(h);
      var grid = el("div", "grid");
      list.forEach(function (s) { grid.appendChild(cardNode(s)); });
      sec.appendChild(grid);
      main.appendChild(sec);
    });

    if (!visible.length) {
      var empty = el("div", "empty");
      empty.appendChild(el("p", null, "没有匹配的站点。"));
      empty.appendChild(el("p", null, "换个关键词，或者清除筛选再试。"));
      main.appendChild(empty);
    }

    if (focusTag) {
      var btn = tagRow.querySelector('[data-tag="' + focusTag.replace(/"/g, '\\"') + '"]');
      if (btn) btn.focus();
    }
  }

  /* ---------- 事件 ---------- */
  qInput.addEventListener("input", function () { state.q = qInput.value; render(); });

  qInput.addEventListener("keydown", function (e) {
    if (e.key === "Enter" && firstVisible && firstVisible.url) {
      e.preventDefault();
      if (newTab) window.open(firstVisible.url, "_blank", "noopener");
      else window.location.href = firstVisible.url;
    } else if (e.key === "Escape") {
      if (qInput.value) { qInput.value = ""; state.q = ""; render(); }
      else qInput.blur();
    }
  });

  freeBox.addEventListener("change", function () { state.free = freeBox.checked; render(); });
  moreBtn.addEventListener("click", function () { state.showAllTags = !state.showAllTags; render(); });
  clearBtn.addEventListener("click", function () {
    state.q = ""; state.tags = []; state.free = false;
    qInput.value = ""; freeBox.checked = false;
    render();
    qInput.focus();
  });

  document.addEventListener("keydown", function (e) {
    if (e.key !== "/" || e.ctrlKey || e.metaKey || e.altKey) return;
    var t = e.target;
    if (t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.isContentEditable)) return;
    e.preventDefault();
    qInput.focus();
    qInput.select();
  });

  render();
})();
</script>
</body>
</html>
