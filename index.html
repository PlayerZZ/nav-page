<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>黄页</title>
<meta name="description" content="赛博牛马的黄页：收藏的好网站，附上自己的解读。">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📒</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&display=swap" rel="stylesheet">
<style>
  /* 和 home.cyberniuma.com 同一套终端风格，主色是黄色（黄页）。
     两套背景：parchment 羊皮纸藏宝图（默认）；dark 暖炭灰。由 <html data-theme> 切换 */
  :root[data-theme="dark"] {
    --bg: #14110a;
    --bg-glow: rgba(255, 214, 10, .07);
    --grid: rgba(255, 214, 10, .035);
    --fg: #fff4d1;
    --accent: #ffd60a;       /* 主色：标题、高亮 */
    --accent-ink: #000;      /* 主色上的文字 */
    --note: #ff9f1c;
    --pink: #ff2e88;
    --dim: #8a7d55;
    --card: #1c1810;
    --card-hover: #262013;
    --border: #3a3220;
    --pop: #1f1a10;
    --glow: 0 0 22px -10px rgba(255, 214, 10, .8);
    --title-shadow: 0 0 20px rgba(255,214,10,.5), 0 0 2px #fff;
    --scan: .14;
  }
  /* 羊皮纸藏宝图：深棕墨水 + 锈红标记（古老），悬停时青色全息光（赛博） */
  :root, :root[data-theme="parchment"] {
    --bg: #e6cf9c;
    --bg-glow: rgba(255, 244, 214, .55);
    --grid: rgba(90, 55, 20, .05);
    --fg: #3a2512;
    --accent: #3a2512;
    --accent-ink: #f1e0b4;
    --note: #a3361b;
    --pink: #a3361b;
    --dim: #86643d;
    --card: rgba(250, 236, 200, .62);
    --card-hover: rgba(255, 246, 222, .9);
    --border: rgba(110, 72, 30, .35);
    --pop: #f6e6bf;
    --glow: 0 0 0 1px rgba(0, 170, 160, .55), 0 0 22px -4px rgba(0, 190, 180, .55);
    --title-shadow: 2px 2px 0 rgba(163, 54, 27, .35);
    --scan: .025;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    color: var(--fg); min-height: 100vh; overflow-x: hidden;
    font-family: "JetBrains Mono", ui-monospace, Menlo, monospace, "PingFang SC", "Microsoft YaHei", sans-serif;
    background:
      radial-gradient(900px 500px at 20% -10%, var(--bg-glow), transparent 70%),
      linear-gradient(var(--grid) 1px, transparent 1px) 0 0 / 28px 28px,
      linear-gradient(90deg, var(--grid) 1px, transparent 1px) 0 0 / 28px 28px,
      var(--bg);
    background-attachment: fixed;
  }
  /* 扫描线：只在暗色背景下有 */
  body::after {
    content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 50;
    background: repeating-linear-gradient(0deg, rgba(0,0,0,var(--scan)) 0 1px, transparent 1px 3px);
  }
  /* ---------- 羊皮纸专属：斑驳底色 + 纸张纤维 + 烧焦的边缘 ---------- */
  :root[data-theme="parchment"] body {
    background:
      url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.75' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .35  0 0 0 0 .22  0 0 0 0 .08  0 0 0 .22 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"),
      radial-gradient(ellipse 600px 380px at 18% 22%, rgba(255, 246, 220, .55), transparent 70%),
      radial-gradient(ellipse 520px 420px at 82% 68%, rgba(150, 100, 40, .18), transparent 70%),
      radial-gradient(ellipse 380px 260px at 60% 12%, rgba(120, 75, 25, .12), transparent 70%),
      radial-gradient(ellipse 300px 300px at 8% 88%, rgba(120, 75, 25, .16), transparent 70%),
      linear-gradient(var(--grid) 1px, transparent 1px) 0 0 / 28px 28px,
      linear-gradient(90deg, var(--grid) 1px, transparent 1px) 0 0 / 28px 28px,
      var(--bg);
    background-attachment: fixed;
  }
  :root[data-theme="parchment"] body::before {
    content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 49;
    box-shadow: inset 0 0 140px rgba(90, 45, 5, .55), inset 0 0 36px rgba(60, 28, 0, .45);
  }
  .compass { display: none; }
  :root[data-theme="parchment"] .compass { display: block; width: 92px; height: 92px; color: var(--fg); opacity: .55; flex: none; }
  .tagline { font-size: 11px; letter-spacing: .18em; color: var(--dim); margin-top: 6px; }
  /* 有解读的站点：暗色主题是角标，羊皮纸主题是锈红色的“✕”（藏宝标记） */
  :root[data-theme="parchment"] .tile .has-note, :root[data-theme="parchment"] .legend .tri {
    border: 0; width: auto; height: auto; line-height: 1;
  }
  :root[data-theme="parchment"] .tile .has-note::after, :root[data-theme="parchment"] .legend .tri::after {
    content: "✕"; color: var(--note); font-size: 11px; font-weight: 800; font-style: normal;
  }
  :root[data-theme="parchment"] .tile .has-note { top: 2px; right: 4px; }
  :root[data-theme="parchment"] .cat-head .name::before { content: "✕ "; color: var(--note); }
  :root[data-theme="parchment"] .pop { box-shadow: 0 0 0 1px rgba(0,170,160,.4), 0 16px 40px -14px rgba(60,30,0,.6); }

  [hidden] { display: none !important; }
  .wrap { max-width: 1120px; margin: 0 auto; padding: 24px 16px 60px; }
  a { color: inherit; }
  button { font: inherit; color: inherit; }

  .bar { display: flex; justify-content: space-between; align-items: center; gap: 12px; color: var(--dim); font-size: 12px; border-bottom: 1px solid var(--border); padding-bottom: 10px; }
  .bar b { color: var(--accent); font-weight: 700; }
  .bar a { text-decoration: none; }
  .bar a:hover { color: var(--accent); }
  .theme { background: none; border: 1px solid var(--border); border-radius: 3px; padding: 2px 8px; cursor: pointer; font-size: 11px; color: var(--dim); }
  .theme:hover { color: var(--accent); border-color: var(--accent); }

  /* ---------- 开场（压缩成一行半） ---------- */
  .head { display: flex; align-items: flex-end; justify-content: space-between; flex-wrap: wrap; gap: 8px 20px; margin: 22px 0 16px; }
  .head .cmd { font-size: 13px; color: var(--dim); }
  .head .cmd .p { color: var(--accent); }
  .head h1 { margin: 0; font-size: clamp(40px, 7vw, 64px); line-height: 1; color: var(--accent); text-shadow: var(--title-shadow); }
  .head .out { font-size: 13px; color: var(--dim); max-width: 420px; }

  /* ---------- 搜索 + 筛选 ---------- */
  .search {
    display: flex; align-items: center; gap: 10px; border: 1px solid var(--border); background: var(--card);
    border-radius: 6px; padding: 10px 12px; font-size: 14px;
  }
  .search:focus-within { border-color: var(--accent); box-shadow: var(--glow); }
  .search .p { color: var(--accent); font-weight: 700; white-space: nowrap; }
  .search input { flex: 1; min-width: 0; background: none; border: 0; outline: none; color: var(--fg); font: inherit; caret-color: var(--accent); }
  .search input::placeholder { color: var(--dim); }
  .search .count { color: var(--dim); font-size: 12px; white-space: nowrap; }
  .search .count b { color: var(--accent); }
  .kbd { border: 1px solid var(--border); border-radius: 3px; padding: 0 5px; font-size: 11px; color: var(--dim); }

  .filters { margin: 10px 0 4px; display: grid; gap: 8px; }
  .row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 12px; }
  .row .k { color: var(--dim); width: 3.5em; flex: none; }
  .chip { background: none; border: 1px solid var(--border); border-radius: 3px; padding: 2px 8px; cursor: pointer; text-decoration: none; font-size: 12px; }
  .chip .n { color: var(--dim); margin-left: 3px; }
  .chip:hover { border-color: var(--accent); }
  .chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .chip[aria-pressed="true"] .n { color: inherit; opacity: .7; }
  .chip.ghost { border-style: dashed; color: var(--dim); }
  .chip.clear { border-color: var(--pink); color: var(--pink); }

  /* ---------- 分类 + 小方块 ---------- */
  .cat { margin-top: 22px; scroll-margin-top: 12px; }
  .cat-head { display: flex; align-items: baseline; gap: 8px; margin: 0 0 8px; font-size: 12px; font-weight: 400; color: var(--dim); }
  .cat-head .name { color: var(--accent); font-size: 15px; font-weight: 800; }
  .cat-head::after { content: ""; flex: 1; border-bottom: 1px dashed var(--border); transform: translateY(-3px); }
  .grid { display: grid; gap: 8px; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
  /* 长名字不能把网格撑宽：网格项默认最小宽度是内容宽度，这里允许缩小，名字用省略号 */
  .grid > * { min-width: 0; }
  .tile {
    position: relative; display: flex; align-items: center; gap: 8px; height: 42px; padding: 0 10px;
    background: var(--card); border: 1px solid var(--border); border-radius: 5px; text-decoration: none;
    transition: border-color .15s, background .15s, box-shadow .15s;
  }
  .tile:hover, .tile:focus-visible, .tile.active { border-color: var(--accent); background: var(--card-hover); box-shadow: var(--glow); outline: none; }
  .ico { flex: none; width: 20px; height: 20px; border-radius: 4px; display: grid; place-items: center; overflow: hidden; }
  .ico img { width: 18px; height: 18px; }
  .ico-l { font-size: 12px; font-weight: 800; color: var(--accent); }
  .tile .name { font-size: 13px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; min-width: 0; }
  /* 收费标记：空心 = 免费，实心 = 收费 / 部分收费 */
  .mark { flex: none; width: 7px; height: 7px; border-radius: 50%; border: 1.5px solid var(--accent); }
  .mark.paid { background: var(--accent); }
  .tile .has-note { position: absolute; top: 3px; right: 4px; width: 0; height: 0; border-top: 6px solid var(--note); border-left: 6px solid transparent; }
  .legend { margin-top: 12px; font-size: 11px; color: var(--dim); display: flex; gap: 14px; flex-wrap: wrap; align-items: center; }
  .legend span { display: inline-flex; align-items: center; gap: 5px; }
  .legend .tri { width: 0; height: 0; border-top: 6px solid var(--note); border-left: 6px solid transparent; }

  /* ---------- 详情：桌面是悬浮提示，手机是底部面板（同一份内容） ---------- */
  .detail .d-head { display: flex; gap: 10px; align-items: center; }
  .detail .d-head .ico { width: 30px; height: 30px; border: 1px solid var(--border); }
  .detail .d-head .ico img { width: 22px; height: 22px; }
  .detail .d-name { font-weight: 800; font-size: 15px; }
  .detail .d-host { font-size: 11px; color: var(--dim); }
  .detail .d-price { margin-left: auto; font-size: 11px; padding: 1px 6px; border-radius: 3px; border: 1px solid var(--accent); color: var(--accent); white-space: nowrap; }
  .detail .d-price.paid { background: var(--accent); color: var(--accent-ink); }
  .detail .d-desc { font-size: 13px; line-height: 1.6; margin: 10px 0 0; }
  .detail .d-note { margin: 10px 0 0; padding: 8px 10px; border-left: 2px solid var(--note); background: color-mix(in srgb, var(--note) 8%, transparent); font-size: 12px; line-height: 1.7; }
  .detail .d-note::before { content: "# 我的解读 "; color: var(--note); font-weight: 700; }
  .detail .d-tags { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 4px 10px; }
  .detail .d-tags button { background: none; border: 0; padding: 0; cursor: pointer; font-size: 12px; color: var(--dim); }
  .detail .d-tags button:hover { color: var(--accent); }

  .pop {
    position: fixed; z-index: 40; width: 320px; padding: 14px; border-radius: 6px;
    background: var(--pop); border: 1px solid var(--accent); box-shadow: 0 12px 40px -12px rgba(0,0,0,.6);
    opacity: 0; transform: translateY(4px); transition: opacity .12s, transform .12s; pointer-events: none;
  }
  .pop.show { opacity: 1; transform: none; pointer-events: auto; }

  .sheet-bg { position: fixed; inset: 0; z-index: 60; background: rgba(0,0,0,.5); opacity: 0; transition: opacity .2s; }
  .sheet {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 61; max-height: 80vh; overflow-y: auto;
    background: var(--pop); border-top: 2px solid var(--accent); border-radius: 12px 12px 0 0; padding: 10px 18px 22px;
    transform: translateY(100%); transition: transform .22s ease-out;
  }
  .sheet .grip { width: 40px; height: 4px; border-radius: 2px; background: var(--border); margin: 0 auto 12px; }
  .sheet.show { transform: none; }
  .sheet-bg.show { opacity: 1; }
  .sheet .go {
    display: block; margin-top: 16px; text-align: center; text-decoration: none; padding: 12px; border-radius: 6px;
    background: var(--accent); color: var(--accent-ink); font-weight: 800;
  }

  .empty { margin-top: 30px; color: var(--dim); font-size: 14px; line-height: 2; }
  .empty b { color: var(--pink); font-weight: 400; }
  footer { margin-top: 36px; color: var(--dim); font-size: 12px; display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px; border-top: 1px solid var(--border); padding-top: 12px; }

  @media (max-width: 600px) {
    :root[data-theme="parchment"] .compass { width: 60px; height: 60px; }
    .search .count, .kbd { display: none; }
    .row .k { width: 100%; }
    .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .head .out { display: none; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="bar">
    <span><a href="https://home.cyberniuma.com">← home</a> · cyberniuma@nav:~</span>
    <span><b id="siteCount">0</b> sites · <b id="catCount">0</b> dirs · <button class="theme" id="themeBtn" type="button"></button></span>
  </div>

  <header class="head">
    <div style="display:flex;gap:16px;align-items:center">
      <!-- 罗盘：只在羊皮纸主题下显示 -->
      <svg class="compass" viewBox="0 0 100 100" aria-hidden="true">
        <circle cx="50" cy="50" r="46" fill="none" stroke="currentColor" stroke-width="1.2"/>
        <circle cx="50" cy="50" r="38" fill="none" stroke="currentColor" stroke-width=".6" stroke-dasharray="2 3"/>
        <path d="M50 6 L57 50 L50 94 L43 50 Z" fill="currentColor" opacity=".85"/>
        <path d="M6 50 L50 43 L94 50 L50 57 Z" fill="currentColor" opacity=".45"/>
        <path d="M50 6 L57 50 L50 50 Z" fill="#a3361b"/>
        <circle cx="50" cy="50" r="3" fill="#f1e0b4" stroke="currentColor"/>
        <text x="50" y="4.5" font-size="7" text-anchor="middle" fill="currentColor" font-family="serif">N</text>
      </svg>
      <div>
        <div class="cmd"><span class="p">$</span> cat yellow_pages.txt</div>
        <h1 id="title">黄页</h1>
        <div class="tagline">// TREASURE MAP OF THE INTERNET</div>
      </div>
    </div>
    <div class="out">收藏的好网站，附上自己的解读。悬停（手机上点一下）查看详情。</div>
  </header>

  <label class="search">
    <span class="p">$ grep -i</span>
    <input id="q" type="search" placeholder="名称、用途、解读或标签" autocomplete="off" spellcheck="false" aria-label="搜索站点">
    <span class="count" id="count"></span>
    <span class="kbd" aria-hidden="true">/</span>
  </label>

  <div class="filters">
    <div class="row" id="dirRow"><span class="k">cd</span></div>
    <div class="row" id="tagRow"><span class="k">tags</span></div>
  </div>

  <main id="directory"></main>

  <div class="legend">
    <span><i class="mark"></i>免费</span>
    <span><i class="mark paid"></i>收费 / 部分收费</span>
    <span><i class="tri"></i>有我的解读</span>
  </div>

  <footer><span>© 赛博牛马 · 按 / 搜索，回车打开第一个结果，Esc 清空</span><span>built with AI</span></footer>
</div>

<!-- 桌面：悬浮提示；手机：底部面板 -->
<div class="pop detail" id="pop" role="tooltip"></div>
<div class="sheet-bg" id="sheetBg" hidden></div>
<div class="sheet detail" id="sheet" role="dialog" aria-modal="true" aria-label="站点详情" hidden></div>

<script src="sites.js"></script>
<script>
(() => {
  "use strict";
  const data = window.START_PAGE;
  const $ = (id) => document.getElementById(id);
  const main = $("directory");

  /* ---------- 主题：羊皮纸（默认）/ 暖炭灰，记在浏览器里 ---------- */
  const THEMES = { parchment: "羊皮纸", dark: "暖炭灰" };
  const setTheme = (t) => {
    document.documentElement.dataset.theme = t;
    $("themeBtn").textContent = "theme: " + THEMES[t];
    try { localStorage.setItem("nav-theme", t); } catch (e) {}
  };
  let theme = new URLSearchParams(location.search).get("theme");
  if (!THEMES[theme]) { try { theme = localStorage.getItem("nav-theme"); } catch (e) {} }
  setTheme(THEMES[theme] ? theme : "parchment");
  $("themeBtn").addEventListener("click", () => setTheme(document.documentElement.dataset.theme === "dark" ? "parchment" : "dark"));

  if (!data || !Array.isArray(data.sites)) {
    main.innerHTML = '<div class="empty"><b>cat: sites.js: 没有读到站点数据</b><br>请确认 sites.js 和 index.html 在同一个文件夹，并且 sites.js 没有语法错误。</div>';
    return;
  }
  document.title = data.title || "黄页";
  $("title").textContent = data.title || "黄页";
  const newTab = data.openInNewTab !== false;
  const useFallbackIcon = data.iconFallback !== false;

  /* ---------- 数据整理 ---------- */
  const cats = (data.categories || []).slice();
  const known = new Set(cats.map((c) => c.id));
  const parseUrl = (u) => { try { const x = new URL(u); return /^https?:$/.test(x.protocol) ? x : null; } catch (e) { return null; } };
  const sites = data.sites.filter((s) => s && s.name && s.url).map((s) => {
    const u = parseUrl(s.url);
    const tags = Array.isArray(s.tags) ? s.tags.map(String) : [];
    return {
      name: String(s.name), url: u ? u.href : "", origin: u ? u.origin : "",
      host: u ? u.hostname.replace(/^www\./, "") : String(s.url),
      catId: known.has(s.cat) ? s.cat : "_other",
      desc: s.desc || "", note: s.note || "", tags, price: s.price || "", icon: s.icon || "",
      hay: [s.name, s.url, s.desc, s.note, tags.join(" "), s.price].join(" ").toLowerCase(),
    };
  });
  if (sites.some((s) => s.catId === "_other")) cats.push({ id: "_other", name: "未分类" });
  const tagCount = {};
  sites.forEach((s) => s.tags.forEach((t) => (tagCount[t] = (tagCount[t] || 0) + 1)));
  const allTags = Object.keys(tagCount).sort((a, b) => tagCount[b] - tagCount[a] || a.localeCompare(b, "zh"));
  $("siteCount").textContent = sites.length;
  $("catCount").textContent = cats.length;

  const state = { q: "", tags: [], free: false, showAllTags: false };
  const matches = (s) => {
    if (state.free && s.price !== "免费") return false;
    if (!state.tags.every((t) => s.tags.includes(t))) return false;
    return state.q.toLowerCase().split(/\s+/).filter(Boolean).every((w) => s.hay.includes(w));
  };
  const toggleTag = (t) => {
    const i = state.tags.indexOf(t);
    i >= 0 ? state.tags.splice(i, 1) : state.tags.push(t);
    hidePop(); closeSheet();
    render();
  };

  /* ---------- 小工具 ---------- */
  const el = (tag, cls, text) => {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  };
  const chip = (label, n, pressed, onClick, extra = "") => {
    const b = el("button", "chip " + extra, label);
    b.type = "button";
    if (n != null) b.appendChild(el("span", "n", String(n)));
    if (pressed != null) b.setAttribute("aria-pressed", String(pressed));
    b.addEventListener("click", onClick);
    return b;
  };

  /* 图标：自己指定的 -> 网站自带 favicon -> 备用服务 -> 首字。成功的地址记下来，详情里直接用 */
  const badIcons = new Set(), goodIcon = new Map();
  const iconNode = (s) => {
    const wrap = el("span", "ico");
    wrap.setAttribute("aria-hidden", "true");
    const letter = el("span", "ico-l", Array.from(s.name)[0] || "?");
    wrap.appendChild(letter);
    const sources = s.icon ? [s.icon] : [s.origin && s.origin + "/favicon.ico", useFallbackIcon && s.host && `https://icons.duckduckgo.com/ip3/${s.host}.ico`].filter(Boolean);
    const tryAt = (i) => {
      if (i >= sources.length) return;
      if (badIcons.has(sources[i])) return tryAt(i + 1);
      const img = new Image();
      img.alt = ""; img.referrerPolicy = "no-referrer";
      img.onload = () => {
        if (img.naturalWidth < 2) { badIcons.add(sources[i]); return tryAt(i + 1); }
        goodIcon.set(s, sources[i]);
        if (letter.parentNode === wrap) wrap.replaceChild(img, letter);
      };
      img.onerror = () => { badIcons.add(sources[i]); tryAt(i + 1); };
      img.src = sources[i];
    };
    if (goodIcon.has(s)) { sources.unshift(goodIcon.get(s)); }
    tryAt(0);
    return wrap;
  };

  /* ---------- 详情内容（悬浮提示和底部面板共用） ---------- */
  const fillDetail = (box, s) => {
    box.textContent = "";
    const head = el("div", "d-head");
    head.appendChild(iconNode(s));
    const t = el("div");
    t.appendChild(el("div", "d-name", s.name));
    t.appendChild(el("div", "d-host", s.host));
    head.appendChild(t);
    if (s.price) head.appendChild(el("span", s.price === "免费" ? "d-price" : "d-price paid", s.price));
    box.appendChild(head);
    if (s.desc) box.appendChild(el("p", "d-desc", s.desc));
    if (s.note) box.appendChild(el("p", "d-note", s.note));
    if (s.tags.length) {
      const tags = el("div", "d-tags");
      s.tags.forEach((tag) => {
        const b = el("button", null, "#" + tag);
        b.type = "button";
        b.addEventListener("click", () => toggleTag(tag));
        tags.appendChild(b);
      });
      box.appendChild(tags);
    }
  };

  /* 桌面：悬停 / 键盘聚焦 120ms 后显示，移到提示框上不消失 */
  const pop = $("pop");
  let popFor = null, showTimer, hideTimer;
  const canHover = () => matchMedia("(hover: hover) and (pointer: fine)").matches;
  function showPop(tile, s) {
    clearTimeout(hideTimer);
    clearTimeout(showTimer);
    showTimer = setTimeout(() => {
      if (popFor !== s) fillDetail(pop, s);
      popFor = s;
      document.querySelectorAll(".tile.active").forEach((n) => n.classList.remove("active"));
      tile.classList.add("active");
      // 默认放在方块下方，下面放不下就放上方；水平方向不超出窗口
      const r = tile.getBoundingClientRect(), pw = pop.offsetWidth, ph = pop.offsetHeight, gap = 8;
      const left = Math.min(Math.max(8, r.left), innerWidth - pw - 8);
      const top = r.bottom + gap + ph < innerHeight ? r.bottom + gap : Math.max(8, r.top - gap - ph);
      pop.style.left = left + "px";
      pop.style.top = top + "px";
      pop.classList.add("show");
    }, popFor ? 40 : 120);
  }
  function hidePop() {
    clearTimeout(showTimer);
    hideTimer = setTimeout(() => {
      pop.classList.remove("show");
      document.querySelectorAll(".tile.active").forEach((n) => n.classList.remove("active"));
      popFor = null;
    }, 100);
  }
  pop.addEventListener("mouseenter", () => clearTimeout(hideTimer));
  pop.addEventListener("mouseleave", hidePop);
  addEventListener("scroll", () => { if (pop.classList.contains("show")) hidePop(); }, { passive: true });

  /* 手机（没有悬停）：点一下打开底部面板，面板里再点“打开网站” */
  const sheet = $("sheet"), sheetBg = $("sheetBg");
  function openSheet(s) {
    fillDetail(sheet, s);
    sheet.prepend(el("div", "grip"));
    if (s.url) {
      const go = el("a", "go", "打开网站 →");
      go.href = s.url;
      if (newTab) { go.target = "_blank"; go.rel = "noopener"; }
      sheet.appendChild(go);
    }
    sheet.hidden = sheetBg.hidden = false;
    requestAnimationFrame(() => { sheet.classList.add("show"); sheetBg.classList.add("show"); });
  }
  function closeSheet() {
    if (sheet.hidden) return;
    sheet.classList.remove("show"); sheetBg.classList.remove("show");
    setTimeout(() => { sheet.hidden = sheetBg.hidden = true; }, 220);
  }
  sheetBg.addEventListener("click", closeSheet);
  // 面板往下拖超过 80px 就关闭
  let dragY = null;
  sheet.addEventListener("touchstart", (e) => { if (sheet.scrollTop === 0) dragY = e.touches[0].clientY; }, { passive: true });
  sheet.addEventListener("touchmove", (e) => { if (dragY != null && e.touches[0].clientY - dragY > 80) { dragY = null; closeSheet(); } }, { passive: true });

  /* ---------- 小方块 ---------- */
  const tileNode = (s) => {
    const a = el("a", "tile");
    if (s.url) { a.href = s.url; if (newTab) { a.target = "_blank"; a.rel = "noopener"; } }
    a.setAttribute("aria-label", [s.name, s.price, s.desc].filter(Boolean).join("，"));
    a.appendChild(iconNode(s));
    a.appendChild(el("span", "name", s.name));
    if (s.price) a.appendChild(el("i", s.price === "免费" ? "mark" : "mark paid"));
    if (s.note) a.appendChild(el("i", "has-note"));
    a.addEventListener("mouseenter", () => canHover() && showPop(a, s));
    a.addEventListener("mouseleave", () => canHover() && hidePop());
    a.addEventListener("focus", () => canHover() && showPop(a, s));
    a.addEventListener("blur", () => canHover() && hidePop());
    a.addEventListener("click", (e) => { if (!canHover()) { e.preventDefault(); openSheet(s); } });
    return a;
  };

  /* ---------- 渲染 ---------- */
  let firstVisible = null;
  function render() {
    const visible = sites.filter(matches);
    firstVisible = visible[0] || null;
    const filtering = state.q.trim() !== "" || state.tags.length > 0 || state.free;
    $("count").innerHTML = filtering ? `→ <b>${visible.length}</b> / ${sites.length}` : `${sites.length} sites`;

    const dirRow = $("dirRow");
    dirRow.querySelectorAll(".chip").forEach((n) => n.remove());
    cats.forEach((c) => {
      const n = visible.filter((s) => s.catId === c.id).length;
      if (!n) return;
      const link = el("a", "chip", c.name + "/");
      link.href = "#cat-" + c.id;
      link.appendChild(el("span", "n", String(n)));
      dirRow.appendChild(link);
    });

    const tagRow = $("tagRow");
    tagRow.querySelectorAll(".chip").forEach((n) => n.remove());
    tagRow.appendChild(chip("--free", null, state.free, () => { state.free = !state.free; render(); }));
    allTags
      .filter((t) => state.showAllTags || tagCount[t] >= 2 || state.tags.includes(t))
      .forEach((t) => tagRow.appendChild(chip("#" + t, tagCount[t], state.tags.includes(t), () => toggleTag(t))));
    if (allTags.some((t) => tagCount[t] < 2) || state.showAllTags) {
      tagRow.appendChild(chip(state.showAllTags ? "收起" : "--all", null, null, () => { state.showAllTags = !state.showAllTags; render(); }, "ghost"));
    }
    if (filtering) {
      tagRow.appendChild(chip("clear", null, null, () => {
        Object.assign(state, { q: "", tags: [], free: false });
        $("q").value = "";
        render();
        $("q").focus();
      }, "clear"));
    }

    main.textContent = "";
    cats.forEach((c) => {
      const list = visible.filter((s) => s.catId === c.id);
      if (!list.length) return;
      const sec = el("section", "cat");
      sec.id = "cat-" + c.id;
      const h = el("h2", "cat-head");
      h.appendChild(el("span", null, "~/"));
      h.appendChild(el("span", "name", c.name));
      h.appendChild(el("span", null, String(list.length)));
      sec.appendChild(h);
      const grid = el("div", "grid");
      list.forEach((s) => grid.appendChild(tileNode(s)));
      sec.appendChild(grid);
      main.appendChild(sec);
    });
    if (!visible.length) main.innerHTML = `<div class="empty"><b>grep: 没有匹配的站点</b><br>换个关键词，或者点上面的 clear 清除筛选。</div>`;
  }

  /* ---------- 键盘 ---------- */
  const q = $("q");
  q.addEventListener("input", () => { state.q = q.value; render(); });
  q.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && firstVisible?.url) {
      e.preventDefault();
      newTab ? window.open(firstVisible.url, "_blank", "noopener") : (location.href = firstVisible.url);
    } else if (e.key === "Escape") {
      if (q.value) { q.value = ""; state.q = ""; render(); } else q.blur();
    }
  });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") { hidePop(); closeSheet(); }
    if (e.key !== "/" || e.ctrlKey || e.metaKey || e.altKey) return;
    const t = e.target;
    if (t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.isContentEditable)) return;
    e.preventDefault();
    q.focus();
    q.select();
  });

  render();
})();
</script>
</body>
</html>
